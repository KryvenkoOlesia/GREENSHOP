<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section>
        <form class="form">
            <p class="head-line"><a href="#">Login</a> | <span class="reg">Register</span></p>
            <p class="subtitle">Enter your email and password to register.</p>
            <p>
                <label class="label-wrap">
                    <input class="input" type="text" name="fullname" placeholder="Username">
                </label>
            </p>
            <p>
                <label class="label-wrap">
                    <input class="input" type="email" name="email" placeholder="Enter your email address">
                </label>
            </p>
            <p>
                <label class="label-wrap">
                    <input class="input" type="password" name="password" placeholder="Password">
                </label>
            </p>
            <p>
                <label class="label-wrap">
                    <input class="input" type="password" name="confirm_password" placeholder="Confirm Password">
                </label>
            </p>
            <button type="submit" class="btn-submit"><strong>Register</strong></button>
            <p class="text2">Or register with</p>
            <button class="button_provider">
                <img src="img/google.png" alt="Google" width="20" height="20">
                <span>Continue with Google</span>
            </button>
            <button class="button_provider">
                <img src="img/facebook.png" alt="Facebook" width="20" height="20">
                <span>Continue with Facebook</span>
            </button>

        </form>

    </section>

</body>

</html>
