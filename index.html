<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Page</title>
    <link rel="stylesheet" href="css/reset200802.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section>
        <form class="form">
            <p class="head-line"><span class="log">Login</span> | <a href="#">Register</a></p>
            <p class="subtitle">Enter your username and password to login.</p>
            <p>
                <label class="label-wrap">
                    <input class="input" type="text" name="fullname" placeholder="Username">
                </label>
            </p>
            <p>
                <label class="label-wrap">
                    <input class="input" type="password" name="password" placeholder="Password">
                </label>
            </p>
            <button type="submit" class="btn-submit"><strong>Login</strong></button>
            <p class="text2">Or login with</p>
            <button class="button_provider">
                <img src="img/google.png" alt="Google" width="20" height="20">
                <span>Continue with Google</span>
            </button>
            <button class="button_provider">
                <img src="img/facebook.png" alt="Facebook" width="20" height="20">
                <span>Continue with Facebook</span>
            </button>

        </form>

    </section>

</body>

</html>
